<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>
</head>

<body class="min-h-screen max-w-[1110px] border mx-auto">
    <header>
        <h1 class="text-4xl font-bold text-[#002c5c] ">Job Application Tracker</h1>
        <div class=" grid grid-cols-3 gap-8">
            <!-- ID: totalCount -->
            <div class=" bg-[#f1f2f4] p-4">
                <p class="text-[14px] font-medium text-[#323b49]">Total</p>
                <p id="totalCount" class="text-2xl font-bold text-[#002c5c]">0</p>
            </div>
            <!--ID: interviewCount -->
            <div class=" bg-[#f1f2f4]">
                <p class="text-[14px] font-medium text-[#323b49]">Interview</p>
                <p id="interviewCount" class="text-2xl font-bold text-[#10B981]">0</p>
            </div>
            <!--ID: rejectedCount -->
            <div class=" bg-[#f1f2f4]">
                <p class="text-[14px] font-medium text-[#323b49]">Rejected</p>
                <p id="rejectedCount" class="text-2xl font-bold text-[#EF4444]">0</p>
            </div>
        </div>

    </header>

</body>

</html>
